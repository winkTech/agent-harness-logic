name: Harness Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-health:
    name: Static, Registry, Regression, Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 双 OS 门禁：2026-11-24 已在 WSL Ubuntu-24.04 洁净区（非 root + pytest 9.1.1）定位并修复
        # Linux 侧差异（.githooks/* LF 约束、io-contract 与 render-workbuddy-contract 的 POSIX 路径断言），
        # 全量门禁 492/492 通过、V8 覆盖率 79% >= 66%，恢复双 OS 矩阵。
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22.17.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'

      # 3.12.10 是 3.12 系列最后一个有 Windows 构建的版本：CPython 3.12 在此之后
      # 进入 security-only，只发源码，actions/python-versions 因而做不出 win32 包
      # （3.12.11/12/13 在 manifest 里只有 linux）。升级前先确认新版能跑通 .py 校验与 pytest。
      # ubuntu 侧钉 3.12.10 自 2026-11 起在 ubuntu manifest 持续失败（#86-#91 连续六
      # 次卡 setup）——浮动到 3.12 系列最新可用 linux 构建；windows 保持 3.12.10。
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.os == 'windows-latest' && '3.12.10' || '3.12' }}

      - name: Verify Git, CI, MCP, and plugin contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p var/ci
          node --test core/engine/scripts/test-hooks/git-ci-repro-contract.test.cjs \
            core/engine/scripts/test-hooks/gate-bypass-contract.test.cjs 2>&1 \
            | tee "var/ci/git-ci-contract-${RUNNER_OS}.log"

      # agent-managed-action-eval 的 functional 维度真的会跑 `python -m pytest -q`
      # （fixture 在 core/engine/scripts/test-hooks/fixtures/long-task/，入库的），
      # 而 setup-python 只装解释器不装包。缺 pytest → functionalStatus=failed → exit 1，
      # 表现为 "coverage-runner 测试运行 exit=1"。与 LongTaskEval 不同：那个缺的是
      # var/ 下未入库的历史产物只能跳过，这个缺的只是依赖，装上就能真跑。
      # 钉版本与本仓库其它依赖（node/actions/mcp-pdf/plugins.lock）保持一致的可复现口径。
      - name: Install Python test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet 'pytest==9.1.1'

      # 两个运行时产物不入版本库，全新 checkout 上都没有：
      #   settings.json      —— hook 命令含本机绝对路径；缺了它 manifest 校验会把
      #                         8 个 active 条目全判成"未注册"
      #   .claude/workflows/ —— 整个 .claude/ 被忽略；缺了它工作流镜像漂移检查 ENOENT
      # 这一步按仓库里的权威源重建两者，再各自 --check 一遍，确保门禁校验到真实契约。
      - name: Materialize hook registrations and the workflow mirror
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          node core/engine/scripts/render-hook-settings.cjs
          node core/engine/scripts/render-hook-settings.cjs --check
          node core/engine/scripts/sync-workflow-mirror.cjs
          node core/engine/scripts/sync-workflow-mirror.cjs --check

      # Phase 1.5：技能三宿主投放（~/.claude/skills、~/.agents/skills、~/.codex/skills）
      # + 根 CLAUDE.md/AGENTS.md 入口渲染——全新 runner 上重建后供 harness-ci 渲染族校验。
      - name: Materialize the skill mirrors for all hosts
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          node core/engine/scripts/sync-skills.cjs
          node core/engine/scripts/sync-skills.cjs --check

      # codex/grok 渲染产物写 runner home（~/.codex/hooks.json、~/.grok/hooks.json、
      # ~/.codex/AGENTS.md）——gate 的 render family 会校验两者 --check，runner 上
      # 从未渲染则必红（#97 gate 8-17s 挂的真凶，本地 home==仓库根掩盖）。
      - name: Materialize codex and grok projections
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          node core/engine/scripts/render-codex-hooks.cjs
          node core/engine/scripts/render-codex-hooks.cjs --check
          node core/engine/scripts/render-grok-hooks.cjs
          node core/engine/scripts/render-grok-hooks.cjs --check

      # dist/plugin 与双 marketplace 是 gitignore 的可再生产物（sha 随组装变化）——
      # 全新 checkout 上没有，gate 的 render family 会校验 sync-plugin-dist --check。
      # 组装分两步：①仓库内 skills/ 运行时镜像是 dist 的 core 技能源——fresh checkout
      # 上不存在（本机 home==仓库根的巧合在 CI 上不成立），用 HARNESS_SKILLS_DIR
      # 覆盖投到仓库根；②按 marketplace 契约组装后再校验。
      - name: Materialize the plugin distribution
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          HARNESS_SKILLS_DIR="$GITHUB_WORKSPACE/skills" node core/engine/scripts/sync-skills.cjs
          node core/engine/scripts/sync-plugin-dist.cjs
          node core/engine/scripts/sync-plugin-dist.cjs --check

      - name: Run the fail-closed Harness gate
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
          HARNESS_COVERAGE_SUMMARY_FILE: ${{ github.workspace }}/var/coverage/coverage-summary.json
          HARNESS_NO_PERSIST: '1'
          HARNESS_VERIFY_READONLY: '1'
          HARNESS_NO_DIAGNOSTIC_WRITES: '1'
        run: |
          set -o pipefail
          if ! node core/engine/scripts/harness-ci.cjs 2>&1 | tee "var/ci/harness-ci-${RUNNER_OS}.log"; then
            {
              echo "### Harness gate 失败摘要（${RUNNER_OS}）"
              echo '```'
              grep -E "FAIL|✖|Error|error=" "var/ci/harness-ci-${RUNNER_OS}.log" | head -40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test -s var/coverage/coverage-summary.json

      - name: Write immutable-run provenance
        if: always()
        shell: bash
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p var/ci
          node -e 'const fs=require("node:fs"); const cp=require("node:child_process"); const o={schemaVersion:1,commitSha:process.env.CI_COMMIT_SHA,ref:process.env.CI_REF,runId:process.env.CI_RUN_ID,runnerOs:process.env.RUNNER_OS,node:process.version,python:cp.execFileSync("python",["--version"],{encoding:"utf8"}).trim(),coverage:"var/coverage/coverage-summary.json",generatedAt:new Date().toISOString()}; fs.writeFileSync(`var/ci/provenance-${process.env.RUNNER_OS}.json`,JSON.stringify(o,null,2)+"\n");'

      - name: Upload logs, coverage, and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-evidence-${{ runner.os }}
          path: |
            var/ci/
            var/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
