name: Harness Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-health:
    name: Static, Registry, Regression, Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 22.17.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'

      # 3.12.10 是 3.12 系列最后一个有 Windows 构建的版本：CPython 3.12 在此之后
      # 进入 security-only，只发源码，actions/python-versions 因而做不出 win32 包
      # （3.12.11/12/13 在 manifest 里只有 linux）。升级前先确认新版能跑通 .py 校验与 pytest。
      - name: Use Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      - name: Verify Git, CI, MCP, and plugin contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p var/ci
          node --test engine/scripts/test-hooks/git-ci-repro-contract.test.cjs \
            engine/scripts/test-hooks/gate-bypass-contract.test.cjs 2>&1 \
            | tee "var/ci/git-ci-contract-${RUNNER_OS}.log"

      # 两个运行时产物不入版本库，全新 checkout 上都没有：
      #   settings.json      —— hook 命令含本机绝对路径；缺了它 manifest 校验会把
      #                         8 个 active 条目全判成"未注册"
      #   .claude/workflows/ —— 整个 .claude/ 被忽略；缺了它工作流镜像漂移检查 ENOENT
      # 这一步按仓库里的权威源重建两者，再各自 --check 一遍，确保门禁校验到真实契约。
      - name: Materialize hook registrations and the workflow mirror
        shell: bash
        env:
          CLAUDE_HARNESS_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          node engine/scripts/render-hook-settings.cjs
          node engine/scripts/render-hook-settings.cjs --check
          node engine/scripts/sync-workflow-mirror.cjs
          node engine/scripts/sync-workflow-mirror.cjs --check

      - name: Run the fail-closed Harness gate
        shell: bash
        env:
          CLAUDE_HARNESS_ROOT: ${{ github.workspace }}
          CLAUDE_HARNESS_NO_PERSIST: '1'
          CLAUDE_HARNESS_VERIFY_READONLY: '1'
          CLAUDE_NO_DIAGNOSTIC_WRITES: '1'
        run: |
          set -o pipefail
          node engine/scripts/harness-ci.cjs 2>&1 \
            | tee "var/ci/harness-ci-${RUNNER_OS}.log"

      - name: Write immutable-run provenance
        if: always()
        shell: bash
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p var/ci
          node -e 'const fs=require("node:fs"); const cp=require("node:child_process"); const o={schemaVersion:1,commitSha:process.env.CI_COMMIT_SHA,ref:process.env.CI_REF,runId:process.env.CI_RUN_ID,runnerOs:process.env.RUNNER_OS,node:process.version,python:cp.execFileSync("python",["--version"],{encoding:"utf8"}).trim(),coverage:"var/coverage/coverage-summary.json",generatedAt:new Date().toISOString()}; fs.writeFileSync(`var/ci/provenance-${process.env.RUNNER_OS}.json`,JSON.stringify(o,null,2)+"\n");'

      - name: Upload logs, coverage, and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-evidence-${{ runner.os }}
          path: |
            var/ci/
            var/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
