name: Harness Health Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files exist
        run: |
          count=$(find . -name '*.md' -not -path './.git/*' | wc -l)
          echo "Found $count markdown files"
          [ "$count" -gt 0 ] || { echo "No markdown files found!"; exit 1; }

  json-syntax:
    name: JSON Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          errors=0
          while IFS= read -r file; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "FAIL: $file is not valid JSON"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -not -path './.wright/*' 2>/dev/null)
          echo "Invalid JSON files: $errors"
          [ "$errors" -eq 0 ] || exit 1

  python-lint:
    name: Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: |
          files=$(find . -name '*.py' -not -path './.git/*' -not -path './backups/*' 2>/dev/null | head -50)
          if [ -n "$files" ]; then
            echo "$files" | xargs ruff check --exit-non-zero-on-fix
            echo "Python lint complete"
          else
            echo "No Python files to check"
          fi
      - name: Check workflow references
        run: |
          errors=0
          for ref in $(grep -oP 'Workflow\(\{name: \"\K[^\"]+' CLAUDE.md 2>/dev/null); do
            [ -f "workflows/${ref}.js" ] && echo "OK: $ref" || { echo "MISSING: $ref"; errors=$((errors+1)); }
          done
          [ "$errors" -eq 0 ] || exit 1
      - name: Check hook file integrity
        run: |
          errors=0
          config="engine/hooks/hook-config.json"
          if [ -f "$config" ]; then
            while IFS= read -r hook_path; do
              full_path="engine/hooks/${hook_path}"
              if [ -f "$full_path" ]; then
                echo "OK: $hook_path"
              else
                echo "MISSING: $hook_path"
                errors=$((errors+1))
              fi
            done < <(jq -r '.hooks | to_entries[] | select(.value.enabled == true) | .key' "$config")
          else
            echo "WARNING: $config not found, skipping hook check"
          fi
          [ "$errors" -eq 0 ] || exit 1