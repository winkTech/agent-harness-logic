name: Harness Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness-health:
    name: Static, Registry, Regression, Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the fail-closed Harness gate
        env:
          CLAUDE_HARNESS_ROOT: ${{ github.workspace }}
          CLAUDE_HARNESS_NO_PERSIST: '1'
          CLAUDE_HARNESS_VERIFY_READONLY: '1'
          CLAUDE_NO_DIAGNOSTIC_WRITES: '1'
        run: node engine/scripts/harness-ci.cjs
