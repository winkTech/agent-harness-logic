# FPGA Agent Harness 配置
# 本地环境：Windows 11, 用户 Lihan

# ============================================================
# LLM 配置
# ============================================================
# 方案1: 使用小米 mimo API（默认）
# 方案2: 使用本地 vLLM
# 方案3: 使用其他 OpenAI 兼容 API
# ============================================================

llm:
  # 方案1: 小米 mimo API（与 .claude/settings.json 保持一致）
  base_url: "https://token-plan-cn.xiaomimimo.com/anthropic"
  model: "mimo-v2.5-pro"
  api_key: "${ANTHROPIC_AUTH_TOKEN}"  # 从环境变量读取
  max_tokens: 4096
  temperature: 0.1

  # 方案2: 本地 vLLM（取消注释使用）
  # base_url: "http://localhost:8000/v1"
  # model: "your-model-name"
  # api_key: "EMPTY"
  # max_tokens: 4096
  # temperature: 0.1

  # 方案3: 其他 OpenAI 兼容 API
  # base_url: "https://api.openai.com/v1"
  # model: "gpt-4"
  # api_key: "${OPENAI_API_KEY}"
  # max_tokens: 4096
  # temperature: 0.1

# ============================================================
# Agent 配置
# ============================================================
agent:
  max_iterations: 50        # 最大迭代次数
  token_threshold: 100000   # 触发压缩的 token 阈值
  keep_recent_results: 3    # 保留最近的工具结果数量

# ============================================================
# 工具配置
# ============================================================
tools:
  workdir: "."              # 工作目录（当前目录）
  enabled:
    - file                  # 文件读写
    - shell                 # Shell 命令
    - verilog               # Verilog 分析
    - matlab                # MATLAB 分析
    - fpga                  # FPGA 工具链

  # 危险命令黑名单
  dangerous_commands:
    - "rm -rf /"
    - "sudo"
    - "shutdown"
    - "reboot"
    - "> /dev/"
    - "mkfs"
    - "dd if="
    - ":(){:|:&};:"

  # 文件大小限制（字节）
  max_file_size: 10485760   # 10MB

# ============================================================
# 技能配置
# ============================================================
skills:
  directory: "skills"       # 技能目录（相对于 fpga-agent-harness）

# ============================================================
# 记忆系统配置
# ============================================================
memory:
  directory: ".memory"      # 记忆存储目录
  max_entries: 1000         # 最大记忆条目数
  auto_cleanup: true        # 自动清理过期记忆
  cleanup_days: 30          # 清理天数

# ============================================================
# 任务系统配置
# ============================================================
tasks:
  directory: ".tasks"       # 任务存储目录
  max_tasks: 100            # 最大任务数
  auto_archive: true        # 自动归档已完成任务
  archive_days: 7           # 归档天数

# ============================================================
# 日志配置
# ============================================================
logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  file: "agent.log"         # 日志文件
  max_size: 10485760        # 10MB
  backup_count: 5           # 备份数量

# ============================================================
# 安全配置
# ============================================================
security:
  # 路径白名单（允许访问的目录）
  allowed_paths:
    - "."
    - "C:/Users/Lihan/Documents"
    - "C:/Users/Lihan/Desktop"

  # 路径黑名单（禁止访问的目录）
  blocked_paths:
    - "C:/Windows"
    - "C:/Program Files"
    - "C:/Users/Lihan/.ssh"
    - "C:/Users/Lihan/.aws"

  # 命令超时（秒）
  command_timeout: 120

# ============================================================
# FPGA 工具链配置
# ============================================================
fpga:
  # Vivado 配置
  vivado:
    path: ""                # Vivado 安装路径（留空使用系统 PATH）
    version: "2023.2"       # Vivado 版本
    default_part: "xc7a35tcpg236-1"  # 默认 FPGA 器件

  # ModelSim 配置
  modelsim:
    path: ""                # ModelSim 安装路径（留空使用系统 PATH）
    default_library: "work" # 默认库

  # 综合配置
  synthesis:
    default_strategy: "Vivado Synthesis Defaults"
    default_impl: "Vivado Implementation Defaults"

# ============================================================
# MATLAB 配置
# ============================================================
matlab:
  path: ""                  # MATLAB 安装路径（留空使用系统 PATH）
  default_timeout: 300      # 默认超时（秒）

# ============================================================
# 开发环境配置
# ============================================================
development:
  # 默认工作目录
  default_workdir: "C:/Users/Lihan/Documents/FPGA"

  # 项目模板目录
  templates_dir: "templates"

  # 自动保存
  auto_save: true
  auto_save_interval: 300   # 秒

# ============================================================
# 用户偏好
# ============================================================
preferences:
  language: "zh-CN"         # 界面语言
  encoding: "utf-8"         # 文件编码
  line_ending: "crlf"       # 行尾符（Windows）
  tab_size: 4               # Tab 大小
  insert_spaces: true       # 使用空格替代 Tab
