#==============================================================================
# flow.cfg — vivado_flow.tcl 配置模板
#
# 用法:
#   vivado -mode batch -nojournal -nolog \
#     -source skills/vivado-flow/scripts/vivado_flow.tcl \
#     -tclargs -cfg <本文件> [其他 CLI 选项]
#
# 语法: key = value，每行一条；# 起头为注释；空行忽略。
# 优先级: CLI 选项 > 本文件 > 脚本内默认值。
#         所以可以把工程固定项写死在这里，用 CLI 只覆盖 -from/-to 之类的每次都变的项。
#
# 注意: 键名用下划线（impl_directive / fail_fast / phys_opt），
#       对应的 CLI 选项用连字符（-impl-directive / -no-fail / -no-phys-opt）。
#       未知键会打 WARNING 并忽略，不会静默生效 —— 拼错了看得见。
#==============================================================================

#--- 必填 ---------------------------------------------------------------------
top  = top
part = xc7a100tcsg324-2

#--- 源与约束 -----------------------------------------------------------------
# src: HDL 源目录，递归扫描 .sv/.svh/.v/.vh/.vhd/.vhdl
src  = 01_src/00_hdl
# filelist: .f 清单（支持嵌套 -f）。给了 filelist 就不再扫 src。
# filelist = 01_src/files.f
# xdc: 约束目录或单个 .xdc 文件
xdc  = 03_xdc

#--- 输出 ---------------------------------------------------------------------
# 下分 rpt/（报告 + flow_summary.json）、dcp/（各阶段检查点）、bit/（位流）
out  = 04_prj

#--- 阶段区间 -----------------------------------------------------------------
# 可选: rtlcheck synth opt place route bitstream
from = rtlcheck
to   = synth

#--- 综合/实现策略 -------------------------------------------------------------
# mode: default | ooc（out_of_context，单模块/CBB 评估）
mode = default
# directive      = AreaOptimized_high
# impl_directive = Explore
# jobs           = 8

# phys_opt = 0   # 跳过 phys_opt_design（等价 CLI -no-phys-opt）
# fail_fast = 0  # 跑完所有阶段再判定（等价 CLI -no-fail）

#--- 宏 / include / 顶层参数（可重复，每行一条）--------------------------------
# define  = SIM_SPEEDUP
# define  = DATA_W=16
# incdir  = 01_src/00_hdl/include
# generic = P_W=12
