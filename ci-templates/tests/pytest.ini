[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    slow: 标记慢速测试
    fpga: FPGA 相关测试
    simulation: 仿真测试

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
