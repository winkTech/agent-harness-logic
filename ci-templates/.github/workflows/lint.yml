# 代码检查工作流
name: Code Lint Check

on:
  push:
    branches: [ main, 'feat/*', 'fix/*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-verilog:
    name: Verilog/SV Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Verilog syntax
        run: |
          find . -name "*.v" -o -name "*.sv" | while read file; do
            echo "Checking: $file"
            # 使用 iverilog 进行语法检查
            iverilog -t null "$file" 2>&1 || true
          done

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" | xargs ruff check

  lint-matlab:
    name: MATLAB Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MATLAB syntax
        run: |
          echo "MATLAB lint requires MATLAB installation"
          echo "Consider using checkcode() manually"

  check-gitignore:
    name: Check .gitignore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found!"
            exit 1
          fi

      - name: Check for large files
        run: |
          git ls-files | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo 0)
            if [ "$size" -gt 52428800 ]; then
              echo "ERROR: File too large (>50MB): $file"
              exit 1
            fi
          done

  check-sim-artifacts:
    name: Check Simulation Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for simulation artifacts
        run: |
          for pattern in "transcript" "*.wlf" "*.vcd" "work/"; do
            files=$(git ls-files | grep -E "$pattern$" || true)
            if [ -n "$files" ]; then
              echo "WARNING: Simulation artifacts found:"
              echo "$files"
            fi
          done
