# TDD 工作流 GitHub Actions 配置
# 自动执行测试、覆盖率检查、代码质量检查

name: TDD Pipeline

on:
  push:
    branches: [ main, 'feat/*', 'fix/*' ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 80

jobs:
  # ==================== 测试阶段 ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  # ==================== 覆盖率检查 ====================
  coverage:
    name: Check Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.MIN_COVERAGE }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==================== 代码质量检查 ====================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  # ==================== 类型检查 ====================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports || true

  # ==================== 安全检查 ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ==================== TDD 验证 ====================
  tdd-validation:
    name: TDD Validation
    runs-on: ubuntu-latest
    needs: [test, coverage, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify TDD workflow
        run: |
          echo "✅ All tests passed"
          echo "✅ Coverage meets threshold"
          echo "✅ Code quality checks passed"
          echo ""
          echo "TDD workflow validation complete!"

  # ==================== 合并门禁 ====================
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [tdd-validation, type-check, security]
    if: github.event_name == 'pull_request'

    steps:
      - name: All checks passed
        run: |
          echo "✅ All TDD checks passed!"
          echo "Ready to merge."

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **TDD Quality Gate Passed**\n\nAll checks completed:\n- Tests: ✅\n- Coverage: ✅\n- Lint: ✅\n- Type Check: ✅\n- Security: ✅\n\nReady to merge!'
            })
